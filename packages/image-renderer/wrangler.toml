name = "item-image-worker"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "item.shiploadgame.com/*", zone_name = "shiploadgame.com" }
]

rules = [
  { type = "CompiledWasm", globs = ["**/*.wasm"],  fallthrough = false },
  { type = "Data",         globs = ["**/*.woff2"], fallthrough = false },
  { type = "Text",         globs = ["**/*.svg"],   fallthrough = false }
]

[version_metadata]
binding = "CF_VERSION_METADATA"

[alias]
elliptic = "./src/shims/elliptic-empty.cjs"
